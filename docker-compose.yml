services:
  app:
    image: ghcr.io/mostafa-elmoalem/roas-unit-economics-calculator:latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trueroas-calculator
    restart: unless-stopped
    # Isolated: port 8080 is accessible internally to Nginx Proxy Manager on airbot-stack_app-network
    expose:
      - "8080"
    # Optional: uncomment only if you need direct access via host port without a reverse proxy:
    # ports:
    #   - "${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - proxy-network

networks:
  default:
  proxy-network:
    external: true
    name: ${PROXY_NETWORK:-airbot-stack_app-network}
